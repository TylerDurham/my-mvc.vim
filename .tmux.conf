# ~/.tmux.conf — minimal viable config

# GENERAL

# Start windows and panes at 1 to match keyboard layout
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g display-time 3000
set -sg escape-time 10

# TERMINAL

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# OSC 52 clipboard — copies reach the local clipboard, even over SSH
set -g set-clipboard on

# PREFIX

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# KEY BINDINGS

bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind c new-window -c "#{pane_current_path}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable arrow-key pane resizing
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Fuzzy switch / kill sessions (needs fzf)
bind s display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"
bind d display-popup -E "tmux list-sessions -F '#{session_name}' | fzf -m --reverse | xargs -r -I{} tmux kill-session -t {}"

# COPY MODE

set -g mode-keys vi
bind -T copy-mode-vi v             send-keys -X begin-selection
bind -T copy-mode-vi C-v           send-keys -X rectangle-toggle
bind -T copy-mode-vi y             send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# THEME

# Uses terminal palette colors so it follows your terminal theme
set -g status on
set -g status-style "bg=default,fg=white"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

set -g message-style "fg=cyan,bg=black,align=centre"
set -g message-command-style "fg=cyan,bg=black,align=centre"

set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=blue"

set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=green"

set -g window-status-separator ""
set -g window-status-format " #[fg=blue]#I:#[fg=white] #W "
set -g window-status-current-format " #[fg=blue]#I:#[fg=green,bold] #{b:pane_current_path}#[nobold] "

# Prefix indicator turns magenta while the prefix is active
set -g status-left "#{?client_prefix,#[fg=magenta],#[fg=green]}● "
set -g status-right "#[fg=white]#W #[fg=blue]│ #[fg=cyan]#S #[fg=blue]│ #[fg=white]#h "

set -g clock-mode-colour blue
set -g mode-style "fg=blue,bg=black,bold"
